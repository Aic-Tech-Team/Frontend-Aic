services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_API_VERSION: ${NEXT_PUBLIC_API_VERSION}

    image: aic-frontend
    container_name: aic-frontend
    restart: unless-stopped

    environment:
      # Runtime only. Not a build arg — NEXT_PUBLIC_* is already inlined.
      # Point at the backend container, e.g. http://api:8000/api
      API_BASE_URL: ${API_BASE_URL:-}

    ports:
      - "127.0.0.1:8040:3000"

    networks:
      - app-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    external: true
    name: ${BACKEND_NETWORK_NAME}
