services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://kaic.karaj.iau.ir}
        NEXT_PUBLIC_API_VERSION: ${NEXT_PUBLIC_API_VERSION:-1.0}

    image: aic-frontend
    container_name: aic-frontend
    restart: unless-stopped

    ports:
      - "127.0.0.1:8040:3000"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
